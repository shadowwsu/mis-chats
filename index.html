<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Web</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Segoe UI,Arial,sans-serif;
}

iframe{
    width:100%;
    height:100%;
    border:0;
}

/* Pantalla de conexión */

#loading{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:99999;
    transition:opacity .8s ease;
}

#loading.hide{
    opacity:0;
    pointer-events:none;
}

.connect{
    font-size:72px;
    font-weight:300;
    color:white;

    text-shadow:
        0 0 20px rgba(255,255,255,.15);

    animation:float 2s ease-in-out infinite;
}

.brand{
    margin-top:14px;
    color:#666;
    font-size:16px;
    letter-spacing:3px;
    text-transform:uppercase;
}

.dots::after{
    content:"";
    animation:dots 1.5s infinite;
}

/* Aviso de conectado */

#success{
    position:fixed;
    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    background:rgba(15,15,15,.95);
    color:white;

    padding:18px 28px;

    border-radius:14px;

    backdrop-filter:blur(12px);

    box-shadow:
        0 0 40px rgba(255,255,255,.08);

    opacity:0;

    z-index:100000;

    transition:.5s;

    font-size:18px;
}

#success.show{
    opacity:1;
}

/* Indicador permanente */

#status{
    position:fixed;

    top:12px;
    left:12px;

    background:rgba(0,0,0,.25);

    color:rgba(255,255,255,.75);

    padding:8px 12px;

    border-radius:10px;

    backdrop-filter:blur(8px);

    opacity:0;

    transition:.5s;

    z-index:9999;
}

#status.show{
    opacity:1;
}

#status small{
    display:block;
    margin-top:2px;
    color:rgba(255,255,255,.4);
    font-size:11px;
}

/* Animaciones */

@keyframes dots{
    0%{content:"";}
    33%{content:".";}
    66%{content:"..";}
    100%{content:"...";}
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-4px);}
    100%{transform:translateY(0);}
}
</style>
</head>
<body>

<div id="loading">
    <div class="connect">
        Conectando<span class="dots"></span>
    </div>

    <div class="brand">
        Shadow Web
    </div>
</div>

<div id="success">
    ✓ Conectado correctamente
</div>

<div id="status">
    <div>● Conectado</div>
    <small>Shadow Web</small>
</div>

<iframe
    id="vdo"
    allow="autoplay;camera;microphone;fullscreen;display-capture"
    src="https://vdo.ninja/?view=YbHy8kq&cleanoutput&transparent&autostart">
</iframe>

<script>

const iframe = document.getElementById("vdo");
const status = document.getElementById("status");
const loading = document.getElementById("loading");
const success = document.getElementById("success");

window.addEventListener("message",(e)=>{

    if(e.source !== iframe.contentWindow) return;

    if(e.data && e.data.action){

        iframe.contentWindow.postMessage({
            setBufferDelay:4500,
            UUID:"*"
        },"*");

    }

});

setTimeout(()=>{

    iframe.contentWindow.postMessage({
        setBufferDelay:4500,
        UUID:"*"
    },"*");

    loading.classList.add("hide");

    setTimeout(()=>{

        success.classList.add("show");

        setTimeout(()=>{

            success.classList.remove("show");
            status.classList.add("show");

        },2500);

    },600);

},4500);

</script>

</body>
</html>
