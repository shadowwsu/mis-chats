<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Segoe UI,Arial,sans-serif;
}

iframe{
    width:100%;
    height:100%;
    border:0;
}

#loading{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:99999;
    transition:opacity .8s ease;
}

#loading.hide{
    opacity:0;
    pointer-events:none;
}

.logo{
    color:white;
    font-size:64px;
    font-weight:700;
    letter-spacing:8px;
    text-shadow:
        0 0 10px rgba(255,255,255,.25),
        0 0 30px rgba(255,255,255,.15);
}

.subtitle{
    margin-top:10px;
    color:#666;
    font-size:14px;
    letter-spacing:4px;
    text-transform:uppercase;
}

#status{
    position:fixed;
    top:12px;
    left:12px;
    background:rgba(0,0,0,.35);
    color:rgba(255,255,255,.65);
    padding:6px 10px;
    border-radius:8px;
    font-size:12px;
    backdrop-filter:blur(6px);
    opacity:0;
    transition:opacity .5s ease;
    z-index:9999;
}

#status.show{
    opacity:1;
}
</style>
</head>
<body>

<div id="loading">
    <div class="logo">SHADOW</div>
    <div class="subtitle">shadow</div>
</div>

<div id="status">
    ● Conectado a Shadow
</div>

<iframe
    id="vdo"
    allow="autoplay;camera;microphone;fullscreen;display-capture"
    src="https://vdo.ninja/?view=YbHy8kq&cleanoutput&transparent&autostart">
</iframe>

<script>

const iframe = document.getElementById("vdo");
const status = document.getElementById("status");
const loading = document.getElementById("loading");

window.addEventListener("message",(e)=>{

    if(e.source !== iframe.contentWindow) return;

    if(e.data && e.data.action){

        iframe.contentWindow.postMessage({
            setBufferDelay: 4500,
            UUID: "*"
        },"*");

    }

});

setTimeout(()=>{

    iframe.contentWindow.postMessage({
        setBufferDelay: 4500,
        UUID: "*"
    },"*");

    loading.classList.add("hide");
    status.classList.add("show");

},4500);

</script>

</body>
</html>
