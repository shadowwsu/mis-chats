<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VDO Ninja Delay 4s</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}
iframe{
    width:100%;
    height:100%;
    border:0;
}
#status{
    position:fixed;
    top:10px;
    left:10px;
    background:rgba(0,0,0,.7);
    color:white;
    padding:8px 12px;
    font-family:Arial;
    z-index:9999;
}
</style>
</head>
<body>

<div id="status">Conectando...</div>

<iframe
    id="vdo"
    allow="autoplay;camera;microphone;fullscreen;display-capture"
    src="https://vdo.ninja/?view=YbHy8kq&cleanoutput&transparent&autostart">
</iframe>

<script>

const iframe = document.getElementById("vdo");
const status = document.getElementById("status");

window.addEventListener("message",(e)=>{

    if(e.source !== iframe.contentWindow) return;

    console.log("VDO:",e.data);

    if(e.data && e.data.action){

        status.innerText = "Conectado";

        iframe.contentWindow.postMessage({
            setBufferDelay: 4000,
            UUID: "*"
        },"*");

        console.log("Delay 4000ms enviado");
    }

});

setTimeout(()=>{

    iframe.contentWindow.postMessage({
        setBufferDelay: 4000,
        UUID: "*"
    },"*");

    status.innerText = "Delay aplicado";

},10000);

</script>

</body>
</html>
